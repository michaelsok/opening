<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Multi-Viewer - Mobile</title>
    <style>
        :root {
            --primary: #1a237e;
            --secondary: #303f9f;
            --accent: #ff9800;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 16px;
            color: var(--accent);
        }

        .game-selector {
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            max-width: 150px;
        }

        .board-section {
            width: 100vw;
            height: 100vw;
            background: #263238;
            flex-shrink: 0;
        }

        #chessboard {
            width: 100%;
            height: 100%;
        }

        #chessboard svg {
            width: 100% !important;
            height: 100% !important;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            background: #000;
            flex-shrink: 0;
        }

        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 16px 0;
            font-size: 20px;
        }

        .btn:active {
            background: #444;
        }

        .btn:disabled {
            opacity: 0.3;
        }

        .move-section {
            flex: 1;
            overflow-y: auto;
            background: var(--card-bg);
            padding: 12px;
        }

        .move-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-family: monospace;
            font-size: 16px;
        }

        .move {
            padding: 6px 10px;
            background: #2c2c2c;
            border-radius: 4px;
            min-width: 45px;
            text-align: center;
        }

        .move.active {
            background: #4caf50;
        }

        .move.current {
            outline: 2px solid #2196f3;
        }

        .move-num {
            color: #888;
            width: 100%;
            font-size: 12px;
            margin-top: 8px;
            border-bottom: 1px solid #333;
        }

        .info-bar {
            padding: 8px 16px;
            background: #000;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Multi-Game View</h1>
        <select class="game-selector" onchange="switchToGame(this.value)" id="game-select">
            {% for i in range(num_games) %}
            <option value="{{ i }}">Game {{ i + 1 }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="info-bar">
        <span id="player-info">Loading...</span>
        <span id="result-info"></span>
    </div>

    <div class="board-section">
        <div id="chessboard"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="goToMove(0)">⇤</button>
        <button class="btn" onclick="previousMove()">←</button>
        <button class="btn" onclick="nextMove()">→</button>
        <button class="btn" onclick="goToMove(totalMoves)">⇥</button>
    </div>

    <div class="move-section">
        <div class="move-list" id="move-list"></div>
    </div>

    <script>
        const gamesData = {{ games_json| safe }};
        let currentGameIndex = 0;
        let currentMove = 0;
        let totalMoves = 0;

        function init() {
            switchToGame(0);
        }

        function switchToGame(idx) {
            currentGameIndex = parseInt(idx);
            const game = gamesData[currentGameIndex];

            document.getElementById('player-info').textContent = `${game.headers.White} vs ${game.headers.Black}`;
            document.getElementById('result-info').textContent = game.headers.Result;

            totalMoves = game.positions.length - 1;
            updateMoveList();
            updateBoard(0);
        }

        function updateMoveList() {
            const game = gamesData[currentGameIndex];
            const list = document.getElementById('move-list');
            list.innerHTML = '';

            game.moves_san.forEach((move, i) => {
                if (i % 2 === 0) {
                    const num = document.createElement('div');
                    num.className = 'move-num';
                    num.textContent = `${(i / 2) + 1}.`;
                    list.appendChild(num);
                }
                const el = document.createElement('div');
                el.className = 'move';
                el.textContent = move;
                el.onclick = () => updateBoard(i + 1);
                el.dataset.index = i;
                list.appendChild(el);
            });
        }

        function updateBoard(idx) {
            if (idx < 0 || idx > totalMoves) return;
            currentMove = idx;
            const game = gamesData[currentGameIndex];
            document.getElementById('chessboard').innerHTML = game.boards[currentMove];

            document.querySelectorAll('.move').forEach(el => {
                const mIdx = parseInt(el.dataset.index);
                el.classList.toggle('active', mIdx < currentMove);
                el.classList.toggle('current', mIdx === currentMove - 1);
            });

            const curr = document.querySelector('.move.current');
            if (curr) curr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function goToMove(idx) { updateBoard(idx); }
        function previousMove() { updateBoard(currentMove - 1); }
        function nextMove() { updateBoard(currentMove + 1); }

        window.addEventListener('load', init);
    </script>
</body>

</html>
