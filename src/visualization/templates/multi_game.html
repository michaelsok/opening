<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Games Viewer - {{ num_games }} Games</title>
    <style>
        {
                {
                'reports.css' | load_css | safe
            }
        }

        .game-navigation {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .game-nav-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .game-list-container {
            position: relative;
            min-width: 200px;
        }

        .game-list-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .game-list-dropdown.show {
            display: block;
        }

        .game-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.8125rem;
            transition: all 0.2s;
        }

        .game-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .game-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-weight: 700;
        }

        .main-content {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 992px) {
            .main-content {
                flex-direction: row;
            }
        }

        .board-container {
            flex: 1.2;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chessboard {
            box-shadow: var(--shadow-xl);
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .move-list-container {
            flex: 1;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.2);
            border-left: 1px solid var(--glass-border);
            max-height: 800px;
            overflow-y: auto;
        }

        .move-list-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .move-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem 0.5rem;
            line-height: 1.8;
        }

        .move {
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9375rem;
        }

        .move:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .move.active {
            color: #10b981;
            font-weight: 600;
        }

        .move.current {
            background: var(--primary);
            color: white !important;
        }

        .move-number {
            color: var(--text-muted);
            font-weight: 700;
        }

        .position-info {
            margin-top: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.1);
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            text-align: center;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Chess Analysis Viewer</h1>
            <p class="subtitle" id="current-game-info">
                <!-- Injected via JS -->
            </p>
        </div>

        <div class="game-navigation">
            <div class="game-nav-controls">
                <button class="btn-nav" onclick="previousGame()" id="prev-game-btn" title="Previous Game">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span id="game-counter" class="subtitle">Game <span id="current-game-num">1</span> of {{ num_games
                    }}</span>
                <button class="btn-nav" onclick="nextGame()" id="next-game-btn" title="Next Game">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
            <div class="game-list-container">
                <button class="btn-nav" onclick="toggleGameList()" style="width: 100%;">
                    <span>Select Game</span>
                    <i data-lucide="list"></i>
                </button>
                <div class="game-list-dropdown" id="game-list-dropdown">
                    {{ game_list_html|safe }}
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="board-container">
                <div id="chessboard"></div>

                <div class="controls">
                    <button class="btn-nav" onclick="goToMove(0)" title="First">
                        <i data-lucide="chevrons-left"></i>
                    </button>
                    <button class="btn-nav" onclick="previousMove()" title="Previous">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <button class="btn-nav" onclick="nextMove()" title="Next">
                        <i data-lucide="chevron-right"></i>
                    </button>
                    <button class="btn-nav" onclick="goToMove(totalMoves)" id="last-move-btn" title="Last">
                        <i data-lucide="chevrons-right"></i>
                    </button>
                </div>

                <div class="position-info">
                    <strong>Move:</strong> <span id="current-move">0</span> / <span id="total-moves">0</span>
                    <div style="margin-top: 5px; opacity: 0.8; font-size: 0.65rem;" id="position-fen"></div>
                </div>

                <div class="move-navigation" id="move-navigation" style="margin-top: 1rem; width: 100%;">
                    <!-- Injected via JS -->
                </div>
            </div>

            <div class="move-list-container">
                <div class="move-list-title">
                    <i data-lucide="file-text"></i>
                    <span>Move List</span>
                </div>
                <div class="move-list" id="move-list">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store all games data
        const gamesData = {{ games_json| safe }};
        let currentGameIndex = 0;
        let currentMove = 0;
        let totalMoves = 0;

        // Initialize
        function init() {
            switchToGame(0);
        }

        // Switch to a specific game
        function switchToGame(gameIndex) {
            if (gameIndex < 0 || gameIndex >= gamesData.length) return;

            currentGameIndex = gameIndex;
            currentMove = 0;

            const game = gamesData[currentGameIndex];
            totalMoves = game.positions.length - 1;

            // Update game info header
            const headers = game.headers;
            const white = headers.White || 'Unknown';
            const black = headers.Black || 'Unknown';
            const result = headers.Result || '*';
            const date = headers.Date || '';
            const site = headers.Site || '';

            document.getElementById('current-game-info').innerHTML = `
                <div><strong>White:</strong> ${white}</div>
                <div><strong>Black:</strong> ${black}</div>
                <div><strong>Result:</strong> ${result}</div>
                ${date ? `<div><strong>Date:</strong> ${date}</div>` : ''}
                ${site ? `<div><strong>Site:</strong> ${site}</div>` : ''}
            `;

            // Update game counter
            document.getElementById('current-game-num').textContent = currentGameIndex + 1;

            // Update game navigation buttons
            document.getElementById('prev-game-btn').disabled = currentGameIndex === 0;
            document.getElementById('next-game-btn').disabled = currentGameIndex === gamesData.length - 1;

            // Update active game in list
            document.querySelectorAll('.game-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === currentGameIndex);
            });

            // Hide game list dropdown
            document.getElementById('game-list-dropdown').classList.remove('show');

            // Regenerate move list
            updateMoveList();

            // Reset to first move
            updateBoard(0);
        }

        // Update move list for current game
        function updateMoveList() {
            const game = gamesData[currentGameIndex];
            const moves_san = game.moves_san;
            const moveListHtml = [];
            let moveNumber = 1;

            for (let i = 0; i < moves_san.length; i += 2) {
                const whiteMove = moves_san[i] || '';
                const blackMove = moves_san[i + 1] || '';
                moveListHtml.push(
                    `<span class="move-number">${moveNumber}.</span> ` +
                    `<span class="move white-move" data-index="${i}">${whiteMove}</span> ` +
                    `<span class="move black-move" data-index="${i + 1}">${blackMove}</span>`
                );
                moveNumber++;
            }

            document.getElementById('move-list').innerHTML = moveListHtml.join(' ');

            // Add click listeners to new moves
            setupMoveList();
        }

        // Update board display
        function updateBoard(moveIndex) {
            if (moveIndex < 0) return;

            const game = gamesData[currentGameIndex];
            // Ensure we don't go out of bounds
            if (moveIndex >= game.positions.length) return;

            currentMove = moveIndex;
            totalMoves = game.positions.length - 1;

            document.getElementById('chessboard').innerHTML = game.boards[moveIndex];
            document.getElementById('current-move').textContent = currentMove;
            document.getElementById('total-moves').textContent = totalMoves;
            document.getElementById('position-fen').textContent = game.positions[moveIndex];

            // Update last button target
            document.getElementById('last-move-btn').setAttribute('onclick', `goToMove(${totalMoves})`);

            // Update button states
            document.querySelector('.btn.first').disabled = currentMove === 0;
            document.querySelector('.btn.prev').disabled = currentMove === 0;
            document.querySelector('.btn.next').disabled = currentMove === totalMoves;
            document.querySelector('.btn.last').disabled = currentMove === totalMoves;

            // Update move navigation buttons
            updateMoveNavigation();

            // Update active move buttons in nav
            document.querySelectorAll('.move-btn').forEach((btn) => {
                const btnMove = parseInt(btn.dataset.move);
                btn.classList.toggle('active', btnMove === currentMove);
            });

            // Update active moves in move list
            document.querySelectorAll('.move').forEach((moveEl) => {
                const moveIdx = parseInt(moveEl.dataset.index);
                if (!isNaN(moveIdx)) {
                    // Highlight played moves
                    const shouldHighlight = moveIdx < currentMove;
                    moveEl.classList.toggle('active', shouldHighlight);

                    // Highlight current move
                    const isCurrentMove = currentMove > 0 && moveIdx === currentMove - 1;
                    moveEl.classList.toggle('current', isCurrentMove);
                }
            });
        }

        // Update move navigation buttons (recreate them)
        function updateMoveNavigation() {
            const moveNav = document.getElementById('move-navigation');
            const game = gamesData[currentGameIndex];

            let html = '';
            for (let i = 0; i < game.positions.length; i++) {
                const activeClass = i === currentMove ? ' current' : '';
                html += `<button class="btn-nav${activeClass}" onclick="goToMove(${i})" data-move="${i}">${i}</button>`;
            }
            moveNav.innerHTML = html;
        }

        // Navigation functions
        function goToMove(moveIndex) {
            updateBoard(moveIndex);
        }

        function previousMove() {
            if (currentMove > 0) {
                updateBoard(currentMove - 1);
            }
        }

        function nextMove() {
            if (currentMove < totalMoves) {
                updateBoard(currentMove + 1);
            }
        }

        function previousGame() {
            if (currentGameIndex > 0) {
                switchToGame(currentGameIndex - 1);
            }
        }

        function nextGame() {
            if (currentGameIndex < gamesData.length - 1) {
                switchToGame(currentGameIndex + 1);
            }
        }

        function toggleGameList() {
            document.getElementById('game-list-dropdown').classList.toggle('show');
        }

        // Close dropdown when clicking outside
        window.onclick = function (event) {
            if (!event.target.matches('.game-list-toggle')) {
                const dropdowns = document.getElementsByClassName("game-list-dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        // Setup move list clicks
        function setupMoveList() {
            document.querySelectorAll('.move').forEach((moveEl) => {
                // Remove old listeners to avoid duplicates (though setting onclick property doesn't duplicate)
                const moveIdx = parseInt(moveEl.dataset.index);
                if (!isNaN(moveIdx)) {
                    moveEl.onclick = function () {
                        // Go to position after this move
                        goToMove(moveIdx + 1);
                    };
                }
            });
        }

        // Keyboard navigation
        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') {
                previousMove();
            } else if (e.key === 'ArrowRight') {
                nextMove();
            } else if (e.key === 'Home') {
                goToMove(0);
            } else if (e.key === 'End') {
                goToMove(totalMoves);
            } else if (e.key === 'PageUp') {
                previousGame();
            } else if (e.key === 'PageDown') {
                nextGame();
            }
        });

        // Initialize on load
        window.addEventListener('load', init);
        lucide.createIcons();
    </script>
</body>

</html>
