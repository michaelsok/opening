<div class="glass-card p-8 animate-fade-in" id="dashboard-step" x-data="{ 
         isDragging: false, 
         file: null,
         color: 'white',
         handleDrop(e) {
             this.isDragging = false;
             if (e.dataTransfer.files.length) this.file = e.dataTransfer.files[0];
         },
         reset() {
             this.file = null;
         }
     }">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold mb-2">Game Repertoire</h1>
        <p class="text-slate-400">Upload your PGN to start the analysis</p>
    </div>

    <!-- User Profile Display -->
    <div class="flex items-center gap-4 bg-slate-800/30 p-4 rounded-xl mb-6">
        {% if profile.avatar %}
        <img src="{{ profile.avatar }}" alt="Avatar" class="w-12 h-12 rounded-full border-2 border-primary/50">
        {% else %}
        <div class="w-12 h-12 rounded-full bg-slate-700 flex items-center justify-center text-2xl">♟️</div>
        {% endif %}
        <div>
            <h3 class="font-bold text-lg">{{ profile.name or username }}</h3>
            <p class="text-sm text-slate-400">{{ profile.location or 'Chess Enthusiast' }}</p>
        </div>
    </div>

    <form hx-post="/repertoire/upload" hx-encoding="multipart/form-data" hx-target="#wizard-step" hx-swap="innerHTML"
        hx-indicator="#upload-indicator">

        <input type="hidden" name="username" value="{{ username }}">
        <input type="hidden" name="color" x-model="color">

        <!-- Color Toggle -->
        <div class="flex bg-slate-900/50 p-1 rounded-lg mb-6">
            <button type="button" @click="color = 'white'"
                class="flex-1 py-2 text-sm font-medium rounded-md transition-all"
                :class="color === 'white' ? 'bg-slate-700 shadow text-white' : 'text-slate-400 hover:text-white'">
                ⚪ White
            </button>
            <button type="button" @click="color = 'black'"
                class="flex-1 py-2 text-sm font-medium rounded-md transition-all"
                :class="color === 'black' ? 'bg-slate-700 shadow text-white' : 'text-slate-400 hover:text-white'">
                ⚫ Black
            </button>
        </div>

        <!-- Upload Zone -->
        <div class="relative mb-6">
            <!-- Drop Area -->
            <div class="border-2 border-dashed rounded-xl p-8 text-center transition-all cursor-pointer"
                :class="isDragging ? 'border-primary bg-primary/10' : 'border-slate-700 hover:border-slate-500 hover:bg-slate-800/30'"
                @dragover.prevent="isDragging = true" @dragleave.prevent="isDragging = false"
                @drop.prevent="handleDrop($event)" @click="$refs.fileInput.click()" x-show="!file">

                <i data-lucide="upload-cloud" class="w-12 h-12 text-primary mx-auto mb-4"></i>
                <p class="font-medium text-white mb-1">Drag & Drop your repertoire .pgn</p>
                <p class="text-sm text-slate-500">or click to browse</p>
                <!-- Actual Input -->
                <input type="file" name="file" x-ref="fileInput" class="hidden" accept=".pgn"
                    @change="file = $event.target.files[0]">
            </div>

            <!-- File Selected State -->
            <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-4 flex items-center justify-between"
                x-show="file" x-cloak x-transition>
                <div class="flex items-center gap-3 overflow-hidden">
                    <i data-lucide="file-text" class="text-primary w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm font-medium truncate" x-text="file ? file.name : ''"></span>
                </div>
                <button type="button" @click="reset()" class="text-slate-400 hover:text-red-400">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn w-full relative" :disabled="!file">
            <span>Start Opening Analysis</span>
            <i data-lucide="zap" class="w-5 h-5 ml-1"></i>
            <!-- Loading Spinner -->
            <div id="upload-indicator"
                class="htmx-indicator absolute inset-0 flex items-center justify-center bg-inherit rounded-lg">
                <div class="flex items-center gap-3">
                    <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-sm">Processing PGN...</span>
                </div>
            </div>
        </button>
    </form>
</div>
