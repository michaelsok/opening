<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' unpkg.com; script-src 'self' unpkg.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' unpkg.com fonts.googleapis.com 'unsafe-inline'; font-src fonts.gstatic.com; img-src 'self' data: https://images.chesscomfiles.com https://www.chess.com https://www.chess.com/bundles/web/images/noavatar_l.84a92b24.gif;">
    <title>{% block title %}Chess Opening Analysis{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Example Design System Styles using Tailwind CDN for simplicity as requested -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#818cf8', // Indigo 400
                        secondary: '#4f46e5', // Indigo 600
                        dark: '#0f172a', // Slate 900
                        glass: 'rgba(255, 255, 255, 0.05)',
                        'glass-border': 'rgba(255, 255, 255, 0.1)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">

    <!-- Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="p-4">
    <div class="w-full max-w-md mx-auto" id="main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Re-initialize icons after HTMX swaps -->
    <script>
        document.body.addEventListener('htmx:afterSwap', function (evt) {
            lucide.createIcons();
        });
        lucide.createIcons();
    </script>
</body>

</html>
